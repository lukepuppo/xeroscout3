name: Windows Development Build

permissions:
  contents: write

on:
  push:
    branches:
      - develop
      - github-actions
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: [self-hosted, windows, docker]
    env:
      RELEASE_TAG: dev-build-${{ github.run_number }}
      RELEASE_NAME: Development Build #${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install renderer dependencies
        working-directory: renderer
        run: npm ci

      - name: Install main dependencies
        working-directory: main
        run: npm ci

      - name: Run build
        shell: bash
        working-directory: main
        run: ./build_luke.sh

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            main/installer/*.exe
            main/out/make/squirrel.windows/x64/*.exe
            main/out/make/squirrel.windows/x64/*.nupkg
            main/out/make/squirrel.windows/x64/RELEASES

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: |
            main/installer/*.exe
            main/out/make/squirrel.windows/x64/*.exe
            main/out/make/squirrel.windows/x64/*.nupkg
            main/out/make/squirrel.windows/x64/RELEASES
